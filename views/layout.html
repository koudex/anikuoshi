<!DOCTYPE html>
<html lang="en" data-theme="<%= theme %>">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title><%= typeof title !== "undefined" ? title : "AniKuoshi" %></title>
  <meta name="description" content="AniKuoshi — watch anime online in HD. Mobile-first PWA with multi-server playback, watch history sync and schedule tracking.">
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/anikuoshi.css?v=1.0.2">
  <!-- NOTE: app.js must load before page scripts (player.js etc.) — head-deferred
       scripts execute in document order, so these run before body scripts. -->
  <script src="/htmx.min.js?v=1.0.2" defer></script>
  <script src="/js/app.js?v=1.0.2" defer></script>
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="sidebar-head">
      <a href="/" class="brand" aria-label="AniKuoshi home">
        <span class="brand-logo" aria-hidden="true">空</span>
        <span class="brand-name">Ani<b>Kuoshi</b></span>
      </a>
    </div>
    <nav class="side-nav">
      <a href="/" class="side-link" data-nav="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Home</span></a>
      <a href="/browse" class="side-link" data-nav="browse"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg><span>Browse</span></a>
      <a href="/search" class="side-link" data-nav="search"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>Search</span></a>
      <a href="/schedule" class="side-link" data-nav="schedule"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Schedule</span></a>
      <a href="/az-list" class="side-link" data-nav="az"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M4 12h7M4 18h5M17 4v14m0 0-3-3m3 3 3-3"/></svg><span>A–Z List</span></a>
      <a href="/history" class="side-link" data-nav="history"><svg class="i" viewBox="0 0 24 24"><path d="M12 8v5l4 2"/><circle cx="12" cy="12" r="9"/></svg><span>History</span></a>
      <a href="/settings" class="side-link" data-nav="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg><span>Settings</span></a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn ghost small theme-quick-btn" type="button" data-action="cycle-theme" title="Cycle theme (T)">
        <span class="theme-dot" aria-hidden="true"></span> Theme
      </button>
      <p class="foot-note">Powered by AniKotoAPI</p>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

  <!-- Topbar -->
  <header class="topbar">
    <button class="icon-btn only-mobile" id="sidebar-open" type="button" aria-label="Open navigation">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="/" class="brand topbar-brand" aria-label="AniKuoshi home">
      <span class="brand-logo" aria-hidden="true">空</span>
      <span class="brand-name only-mobile">Ani<b>Kuoshi</b></span>
    </a>
    <form class="topbar-search" action="/search" method="get" role="search" autocomplete="off">
      <svg class="i search-glyph" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="global-search" name="q" type="search" placeholder="Search anime…" aria-label="Search anime"
             value="<%= typeof q !== 'undefined' && q ? q : '' %>"
             hx-get="/fragments/suggest" hx-trigger="keyup changed delay:250ms" hx-target="#suggest-box" hx-params="q">
      <button class="icon-btn clear-btn" type="button" id="search-clear" aria-label="Clear search" hidden>&times;</button>
      <div class="suggest-box" id="suggest-box" hidden></div>
    </form>
    <a href="/history" class="icon-btn only-mobile" aria-label="Watch history">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 8v5l4 2"/><circle cx="12" cy="12" r="9"/></svg>
    </a>
  </header>

  <!-- Main -->
  <main class="main" id="main">
    <%- body %>
  </main>

  <footer class="app-footer">
    <p><strong>AniKuoshi</strong> — PWA layer on <a href="https://github.com/Shineii86/AniKotoAPI" target="_blank" rel="noopener noreferrer">AniKotoAPI</a> by Shinei Nouzen · MIT</p>
    <p class="foot-dim">All content is served by third parties. For educational purposes.</p>
  </footer>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="/" class="bn-link" data-nav="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Home</span></a>
    <a href="/browse" class="bn-link" data-nav="browse"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v5H4zM13 14h7v5h-7z"/></svg><span>Browse</span></a>
    <button class="bn-link bn-fab" type="button" data-action="quick-search" aria-label="Quick search"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
    <a href="/schedule" class="bn-link" data-nav="schedule"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Schedule</span></a>
    <a href="/history" class="bn-link" data-nav="history"><svg class="i" viewBox="0 0 24 24"><path d="M12 8v5l4 2"/><circle cx="12" cy="12" r="9"/></svg><span>History</span></a>
  </nav>

  <!-- Toasts + global overlay -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="modal" id="global-modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modal-title">Dialog</h3><button class="icon-btn" type="button" data-action="modal-close" aria-label="Close">&times;</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
</body>
</html>
